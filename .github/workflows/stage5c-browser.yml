# One-time Stage 5C browser validation on a GitHub-hosted runner.
# A push starts this job only on ci/stage5c-isolated-browser, and only when
# this workflow file changes. The execution guard then requires that commit
# to have exactly one parent, the reviewed application revision.
name: Stage 5C browser

on:
  push:
    branches:
      - ci/stage5c-isolated-browser
    paths:
      - .github/workflows/stage5c-browser.yml

permissions:
  contents: read

concurrency:
  group: ci-stage5c-isolated-browser
  cancel-in-progress: false

jobs:
  browser:
    name: Isolated browser journey
    runs-on: ubuntu-24.04
    # 45 minutes covers apt, the pinned Python requirements, npm ci, Playwright,
    # and the browser journey, with margin. A low-disk preflight fails first.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      USE_TF: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      STAGE5C_CI: "1"
    steps:
      - name: Check out the approved revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require the isolated push guard
        env:
          REVIEWED_PARENT: 60ad9f39b034a280c02595c2b0b77c2d3fcd29a8
        run: |
          set -euo pipefail
          set +x
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "BLOCKED: event was not accepted"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/ci/stage5c-isolated-browser" ]; then
            echo "BLOCKED: ref was not accepted"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "BLOCKED: checkout did not match the push"
            exit 1
          fi
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "BLOCKED: parent commit was not accepted"
            exit 1
          fi
          parent=$(git rev-parse --verify HEAD^)
          if [ "$parent" != "$REVIEWED_PARENT" ]; then
            echo "BLOCKED: parent commit was not accepted"
            exit 1
          fi
          changed=$(git diff --name-only "$REVIEWED_PARENT" HEAD)
          if [ "$changed" != ".github/workflows/stage5c-browser.yml" ]; then
            echo "BLOCKED: changed files were not accepted"
            exit 1
          fi
          echo "EXECUTION_GUARD_OK"

      - name: Run the browser policy unit tests
        run: |
          set -euo pipefail
          node --check scripts/stage5c_browser_policy.cjs
          node --check scripts/stage5c_browser_guard.cjs
          node --check scripts/stage5c_browser_e2e.cjs
          node --test scripts/stage5c_browser_policy.test.cjs

      - name: Check runner disk headroom before provisioning
        run: |
          set -euo pipefail
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "DISK_AVAIL_KB=${avail_kb}"
          if [ "$avail_kb" -lt 6291456 ]; then
            echo "BLOCKED: runner disk headroom is below 6 GiB"
            exit 1
          fi
          echo "DISK_HEADROOM_OK"

      - name: Reject a checkout that contains local environment files
        run: |
          set -euo pipefail
          test ! -f .env
          test ! -f frontend/.env
          test ! -f frontend/.env.local
          echo "ENV_FILES_ABSENT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install loopback PostgreSQL 15 and Redis
        run: |
          set -euo pipefail
          set +x
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python scripts/stage5c_ci_server.py credentials
          set -a
          # shellcheck disable=SC1091
          source /tmp/stage5c-ci.env
          set +a
          umask 077
          cat > /tmp/stage5c-postgres.env <<EOF
          POSTGRES_USER=lfs_stage5c_ci
          POSTGRES_PASSWORD=$PGPASSWORD
          POSTGRES_DB=lfs_stage5c_ci
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/stage5c-postgres.env
          printf 'bind 0.0.0.0\nprotected-mode yes\nrequirepass %s\n' "$REDIS_PASSWORD" > /tmp/stage5c-redis.conf
          # A failure before the browser step is an infrastructure failure.
          # postgres:15 and redis:7 remain mutable tags. Their registry
          # digests were not pinned because this machine must not pull or
          # retag the shared Docker images. The image id is printed after start.
          docker run -d --name stage5c-postgres \
            -p 127.0.0.1:5432:5432 \
            --env-file /tmp/stage5c-postgres.env \
            postgres:15
          docker run -d --name stage5c-redis \
            -p 127.0.0.1:6379:6379 \
            -v /tmp/stage5c-redis.conf:/usr/local/etc/redis/redis.conf:ro \
            redis:7 \
            redis-server /usr/local/etc/redis/redis.conf
          ready=0
          for _ in $(seq 1 40); do
            if docker exec stage5c-postgres pg_isready -U lfs_stage5c_ci -d lfs_stage5c_ci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          printf 'REDISCLI_AUTH=%s\n' "$REDIS_PASSWORD" > /tmp/stage5c-redis-auth.env
          docker exec --env-file /tmp/stage5c-redis-auth.env stage5c-redis redis-cli --no-auth-warning ping | grep -qx PONG
          echo "POSTGRES_IMAGE_ID=$(docker image inspect postgres:15 --format '{{.Id}}')"
          echo "REDIS_IMAGE_ID=$(docker image inspect redis:7 --format '{{.Id}}')"
          python scripts/stage5c_ci_server.py listeners

      - name: Install the application and migrate the disposable database
        run: |
          set -euo pipefail
          set +x
          python -m pip install -r requirements.txt
          python -c "import fastapi, alembic, psycopg2, redis"
          echo "PYTHON_DEPENDENCIES_IMPORT_OK"
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "DISK_AVAIL_AFTER_PIP_KB=${avail_kb}"
          if [ "$avail_kb" -lt 3145728 ]; then
            echo "BLOCKED: less than 3 GiB remained after Python installation"
            exit 1
          fi
          set -a
          # shellcheck disable=SC1091
          source /tmp/stage5c-ci.env
          set +a
          python scripts/stage5c_ci_server.py upgrade

      - name: Verify the exact-source isolated backend regression gate
        # Run with the candidate source and tests checked out by this job.
        # The review harness uses SQLite and denies external service connections.
        run: |
          set -euo pipefail
          python scripts/run_review_tests.py backend/tests -q --tb=line

      - name: Start the API on loopback
        run: |
          set -euo pipefail
          set +x
          set -a
          # shellcheck disable=SC1091
          source /tmp/stage5c-ci.env
          set +a
          bash -c 'echo $$ > "$1"; exec python scripts/stage5c_ci_server.py serve' bash "$RUNNER_TEMP/stage5c-api.pid" >"$RUNNER_TEMP/stage5c-api.log" 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            if python scripts/stage5c_ci_server.py health; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          echo "API_READY"

      - name: Start Next.js with the disposable API address
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          rm -rf .next
          export NEXT_PUBLIC_API_URL=http://127.0.0.1:18000
          bash -c 'echo $$ > "$1"; exec npx next dev -H 127.0.0.1 -p 13000' bash "$RUNNER_TEMP/stage5c-next.pid" >"$RUNNER_TEMP/stage5c-next.log" 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            if python "$GITHUB_WORKSPACE/scripts/stage5c_ci_server.py" ready-web; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          echo "FRONTEND_READY"

      - name: Install Playwright Chromium outside the frontend
        run: |
          set -euo pipefail
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "DISK_AVAIL_BEFORE_PLAYWRIGHT_KB=${avail_kb}"
          if [ "$avail_kb" -lt 3145728 ]; then
            echo "BLOCKED: less than 3 GiB remained before Playwright installation"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/browser-tools"
          npm --prefix "$RUNNER_TEMP/browser-tools" init -y
          npm --prefix "$RUNNER_TEMP/browser-tools" install playwright@1.55.0
          installed=$(node -p "require(process.env.RUNNER_TEMP + '/browser-tools/node_modules/playwright/package.json').version")
          test "$installed" = "1.55.0"
          echo "PLAYWRIGHT_PIN_OK"
          npm --prefix "$RUNNER_TEMP/browser-tools" exec -- playwright install --with-deps chromium

      - name: Exercise blocked HTTP, WebSocket, and service-worker traffic
        run: |
          set -euo pipefail
          export STAGE5C_PLAYWRIGHT_PATH="$RUNNER_TEMP/browser-tools/node_modules/playwright"
          node scripts/stage5c_browser_guard.integration.cjs

      - name: Run the browser journey and disposable SQL checks
        run: |
          set -euo pipefail
          set +x
          set -a
          # shellcheck disable=SC1091
          source /tmp/stage5c-ci.env
          set +a
          unset DATABASE_URL REDIS_URL JWT_SECRET REDIS_PASSWORD
          export STAGE5C_EXECUTE=1
          export STAGE5C_CI=1
          export STAGE5C_API_URL=http://127.0.0.1:18000
          export STAGE5C_WEB_URL=http://127.0.0.1:13000
          export STAGE5C_PLAYWRIGHT_PATH="$RUNNER_TEMP/browser-tools/node_modules/playwright"
          export STAGE5C_REPORT="$RUNNER_TEMP/stage5c-report.txt"
          export PGHOST=127.0.0.1
          export PGPORT=5432
          export PGUSER=lfs_stage5c_ci
          export PGDATABASE=lfs_stage5c_ci
          node scripts/stage5c_browser_e2e.cjs

      - name: Record the result boundary
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/stage5c-report.txt" ]; then
            cat "$RUNNER_TEMP/stage5c-report.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No sanitized report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "A green check accepts only the non-AI checks that ran. Classification, answer correction, and model-generated reports were not accepted." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage5c-sanitized-report
          path: ${{ runner.temp }}/stage5c-report.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Stop the job services
        if: always()
        run: |
          set +e
          stop_recorded_pid() {
            if [ ! -f "$1" ]; then
              return
            fi
            pid=$(cat "$1")
            case "$pid" in
              ''|*[!0-9]*) return ;;
            esac
            pkill -P "$pid"
            kill "$pid"
          }
          stop_recorded_pid "$RUNNER_TEMP/stage5c-api.pid"
          stop_recorded_pid "$RUNNER_TEMP/stage5c-next.pid"
          docker rm -f stage5c-postgres stage5c-redis
          rm -f /tmp/stage5c-ci.env /tmp/stage5c-postgres.env /tmp/stage5c-redis.conf /tmp/stage5c-redis-auth.env
          echo "CLEANUP_DONE"
