[pytest]
markers =
    slow: marks tests as slow-running load/stress tests (deselect with -m "not slow")

addopts = -m "not slow"

# Coverage — run with: pytest --cov=backend --cov-report=term-missing
# Threshold enforced when --cov flag is passed (not during plain `pytest` runs
# so CI can choose whether to gate on coverage independently of the unit run).
[coverage:run]
source = backend
omit =
    backend/tests/*
    backend/database/migrations/*

[coverage:report]
fail_under = 80
show_missing = true
skip_covered = false
